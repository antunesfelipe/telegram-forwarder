name: Telegram Forwarder Engine

on:
  workflow_dispatch:
    inputs:
      legenda_busca:
        description: 'Legenda exata a buscar (deixe em branco apenas para atualizar legendas)'
        required: false
        type: string

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --only-binary=:all: pyrogram tgcrypto

      - name: Indexar Legendas do Canal
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CANAL_ORIGEM: ${{ secrets.CANAL_ORIGEM }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python atualizar_legendas.py

      - name: Commit e Push do legendas.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add legendas.json
          git commit -m "Atualizando lista de legendas [skip ci]" || exit 0
          git push

      - name: Executar Envio de Mídia
        if: ${{ github.event.inputs.legenda_busca != '' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CANAL_ORIGEM: ${{ secrets.CANAL_ORIGEM }}
          CANAL_DESTINO: ${{ secrets.CANAL_DESTINO }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          LEGENDA_BUSCA: ${{ github.event.inputs.legenda_busca }}
        run: python busca_e_envia.py
