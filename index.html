<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Forwarder Pro</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0f0f12; 
            color: #e0e0e0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        .card { 
            background: #18181c; 
            padding: 28px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 540px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            border: 1px solid #282830;
        }
        
        .header-container { text-align: center; margin-bottom: 20px; }
        .logo-img { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #0088cc;
            box-shadow: 0 4px 14px rgba(0, 136, 204, 0.3);
            margin-bottom: 8px;
        }
        h2 { 
            margin: 5px 0 0 0; 
            color: #0088cc; 
            font-size: 22px; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        label { 
            display: block; 
            margin-top: 14px; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: #aaa; 
            font-weight: 600; 
        }
        textarea, input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #222226; 
            color: #fff; 
            font-size: 13px; 
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus, input[type="text"]:focus, input[type="password"]:focus {
            border-color: #0088cc;
        }
        textarea { height: 60px; resize: vertical; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 22px; }
        button { 
            padding: 12px 16px; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .btn-send { background: #0088cc; color: white; flex: 1; }
        .btn-send:hover { background: #006699; }
        .btn-send:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .btn-cancel { background: #d32f2f; color: white; display: none; }
        .btn-cancel:hover { background: #9a0007; }

        .btn-action { 
            background: #2a2a32; 
            color: #0088cc; 
            padding: 6px 12px; 
            font-size: 12px; 
            font-weight: 600;
            border-radius: 6px; 
            border: 1px solid #3a3a45; 
            cursor: pointer; 
            white-space: nowrap;
        }
        .btn-action:hover { 
            background: #0088cc; 
            color: #fff; 
            border-color: #0088cc; 
        }
        .btn-small-add {
            background: #25252e;
            color: #ccc;
            padding: 4px 8px;
            font-size: 11px;
            border: 1px solid #3d3d4a;
            border-radius: 4px;
            margin-left: 4px;
            cursor: pointer;
        }
        .btn-small-add:hover { background: #0088cc; color: #fff; border-color: #0088cc; }
        
        #status-box { 
            margin-top: 18px; 
            padding: 12px; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: 600; 
            display: none; 
        }
        .in_progress { color: #ffb74d; background: rgba(255, 183, 77, 0.1); border: 1px solid #ffb74d; }
        .success { color: #81c784; background: rgba(129, 199, 132, 0.1); border: 1px solid #81c784; }
        .failure { color: #e57373; background: rgba(229, 115, 115, 0.1); border: 1px solid #e57373; }

        .section-box { margin-top: 22px; border-top: 1px solid #282830; padding-top: 16px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 13px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .dropdown-list { 
            max-height: 160px; 
            overflow-y: auto; 
            background: #121215; 
            border: 1px solid #282830; 
            border-radius: 8px; 
            margin-top: 6px; 
        }
        .dropdown-item { 
            padding: 10px 12px; 
            border-bottom: 1px solid #1c1c22; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
            gap: 10px; 
        }
        .dropdown-item:last-child { border-bottom: none; }
        .item-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; color: #ddd; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-container">
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h2>🚀 Telegram Forwarder</h2>
    </div>

    <label for="ghToken">🔑 Seu GitHub Personal Token:</label>
    <input type="password" id="ghToken" placeholder="Cole seu novo token aqui (github_pat_...)" onchange="salvarToken()">

    <div class="section-box">
        <div class="section-header">
            <span class="section-title">🔍 Canal de Origem</span>
            <button class="btn-action" onclick="forcarVarreduraCanal()">🔄 Forçar Varredura</button>
        </div>
        <div>
            <input type="text" id="searchInput" placeholder="Digite para filtrar as legendas..." oninput="filtrarLegendas()">
            <div class="dropdown-list" id="dropdownList">
                <div style="color: #666; text-align: center; padding: 14px;">Carregando legendas...</div>
            </div>
        </div>
    </div>

    <label for="legenda1">Vídeo 1 - Legenda Exata:</label>
    <textarea id="legenda1" placeholder="Selecione acima ou cole a legenda aqui..."></textarea>

    <label for="legenda2">Vídeo 2 (Opcional):</label>
    <textarea id="legenda2" placeholder="Selecione acima ou cole a legenda aqui..."></textarea>

    <div class="btn-group">
        <button class="btn-send" id="btnSend" onclick="dispararActions()">Enviar Vídeo(s)</button>
        <button class="btn-cancel" id="btnCancel" onclick="cancelarRun()">Parar Execução</button>
    </div>

    <div id="status-box"></div>

    <div class="section-box">
        <div class="section-header">
            <span class="section-title">📋 Histórico de Envios</span>
            <button class="btn-action" onclick="limparHistorico()">Limpar</button>
        </div>
        <div class="dropdown-list" id="historyList">
            <div style="color: #666; text-align: center; padding: 14px;">Nenhum envio registrado.</div>
        </div>
    </div>
</div>

<script>
    const REPO_OWNER = 'antunesfelipe';           
    const REPO_NAME = 'telegram-forwarder';
    const WORKFLOW_ID = 'transferir.yml';

    let legendasCanal = [];
    let currentRunId = null;
    let pollInterval = null;
    let modoVarredura = false;

    window.onload = () => {
        const tokenSalvo = localStorage.getItem('gh_token') || '';
        document.getElementById('ghToken').value = tokenSalvo;
        carregarLegendasJSON();
        carregarHistorico();
    };

    function salvarToken() {
        const token = document.getElementById('ghToken').value.trim();
        localStorage.setItem('gh_token', token);
    }

    function obterToken() {
        return document.getElementById('ghToken').value.trim() || localStorage.getItem('gh_token') || '';
    }

    async function carregarLegendasJSON() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/legendas.json?v=${Date.now()}`);
            if (res.ok) {
                legendasCanal = await res.json();
                filtrarLegendas();
            } else {
                document.getElementById('dropdownList').innerHTML = '<div style="color: #888; text-align: center; padding: 14px;">Clique em "Forçar Varredura" para indexar o canal.</div>';
            }
        } catch (e) {
            document.getElementById('dropdownList').innerHTML = '<div style="color: #888; text-align: center; padding: 14px;">Erro ao carregar lista de legendas.</div>';
        }
    }

    function filtrarLegendas() {
        const termo = document.getElementById('searchInput').value.toLowerCase();
        const filtradas = legendasCanal.filter(l => l.toLowerCase().includes(termo));
        const listDiv = document.getElementById('dropdownList');

        if (filtradas.length === 0) {
            listDiv.innerHTML = '<div style="color: #666; text-align: center; padding: 14px;">Nenhuma legenda encontrada.</div>';
            return;
        }

        listDiv.innerHTML = filtradas.slice(0, 50).map(leg => `
            <div class="dropdown-item">
                <span class="item-text" title="${leg}">${leg}</span>
                <div>
                    <button class="btn-small-add" onclick="selecionarLegenda('${leg.replace(/'/g, "\\'")}', 'legenda1')">+ Vídeo 1</button>
                    <button class="btn-small-add" onclick="selecionarLegenda('${leg.replace(/'/g, "\\'")}', 'legenda2')">+ Vídeo 2</button>
                </div>
            </div>
        `).join('');
    }

    function selecionarLegenda(texto, campoId) {
        document.getElementById(campoId).value = texto;
    }

    async function forcarVarreduraCanal() {
        const token = obterToken();
        if (!token) return atualizarStatus('Por favor, insira o seu GitHub Personal Token acima!', 'failure');

        modoVarredura = true;
        atualizarStatus('⏳ Solicitando varredura ao GitHub...', 'in_progress');
        
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ref: 'main', inputs: { legenda_busca: '' } })
            });

            if (res.status === 204) {
                setTimeout(monitorarStatus, 3000);
            } else {
                const err = await res.json().catch(() => ({}));
                atualizarStatus(`Erro (${res.status}): ${err.message || 'Verifique se o token é válido.'}`, 'failure');
            }
        } catch (e) {
            atualizarStatus('Erro de conexão com o GitHub.', 'failure');
        }
    }

    async function dispararActions() {
        const token = obterToken();
        if (!token) return atualizarStatus('Por favor, insira o seu GitHub Personal Token acima!', 'failure');

        modoVarredura = false;
        const leg1 = document.getElementById('legenda1').value.trim();
        const leg2 = document.getElementById('legenda2').value.trim();

        if (!leg1 && !leg2) return atualizarStatus('Informe ao menos uma legenda!', 'failure');

        const legendaFinal = leg2 ? `${leg1} ||| ${leg2}` : leg1;
        atualizarStatus('⏳ Conectando ao GitHub Actions...', 'in_progress');
        document.getElementById('btnSend').disabled = true;

        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ref: 'main', inputs: { legenda_busca: legendaFinal } })
            });

            if (res.status === 204) {
                setTimeout(monitorarStatus, 4000);
            } else {
                const err = await res.json().catch(() => ({}));
                atualizarStatus(`Erro (${res.status}): ${err.message || 'Falha ao autorizar.'}`, 'failure');
                document.getElementById('btnSend').disabled = false;
            }
        } catch (e) {
            atualizarStatus('Erro de conexão.', 'failure');
            document.getElementById('btnSend').disabled = false;
        }
    }

    async function monitorarStatus() {
        const token = obterToken();
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs?workflow_id=${WORKFLOW_ID}&per_page=1`;

        try {
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            
            if (data.workflow_runs && data.workflow_runs.length > 0) {
                const latestRun = data.workflow_runs[0];
                currentRunId = latestRun.id;

                if (latestRun.status === 'in_progress' || latestRun.status === 'queued') {
                    const msg = modoVarredura ? '⏳ Indexando legendas do Telegram...' : '⏳ Buscando e enviando mídia...';
                    atualizarStatus(`${msg} (${latestRun.status})`, 'in_progress');
                    document.getElementById('btnCancel').style.display = 'block';
                    pollInterval = setTimeout(monitorarStatus, 3000);
                } else if (latestRun.status === 'completed') {
                    document.getElementById('btnCancel').style.display = 'none';
                    document.getElementById('btnSend').disabled = false;
                    
                    if (latestRun.conclusion === 'success') {
                        if (modoVarredura) {
                            atualizarStatus('✅ Legendas atualizadas com sucesso!', 'success');
                            carregarLegendasJSON();
                        } else {
                            atualizarStatus('✅ Vídeo(s) enviado(s) com sucesso!', 'success');
                            salvarHistorico();
                        }
                    } else {
                        atualizarStatus(`❌ Ocorreu um erro no script Python.`, 'failure');
                    }
                }
            }
        } catch (e) { console.error(e); }
    }

    async function cancelarRun() {
        const token = obterToken();
        if (!currentRunId) return;
        atualizarStatus('⏳ Cancelando execução...', 'in_progress');
        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs/${currentRunId}/cancel`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        clearTimeout(pollInterval);
        atualizarStatus('🛑 Execução cancelada.', 'failure');
        document.getElementById('btnCancel').style.display = 'none';
        document.getElementById('btnSend').disabled = false;
    }

    function atualizarStatus(msg, tipo) {
        const div = document.getElementById('status-box');
        div.style.display = 'block';
        div.className = tipo;
        div.innerText = msg;
    }

    function salvarHistorico() {
        const leg1 = document.getElementById('legenda1').value.trim();
        const leg2 = document.getElementById('legenda2').value.trim();
        let historico = JSON.parse(localStorage.getItem('tb_history') || '[]');
        const agora = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

        [leg1, leg2].filter(Boolean).forEach(leg => {
            historico.unshift({ nome: leg, data: agora });
        });

        localStorage.setItem('tb_history', JSON.stringify(historico.slice(0, 30)));
        carregarHistorico();
        document.getElementById('legenda1').value = '';
        document.getElementById('legenda2').value = '';
    }

    function carregarHistorico() {
        const historico = JSON.parse(localStorage.getItem('tb_history') || '[]');
        const container = document.getElementById('historyList');
        if (historico.length === 0) return;
        container.innerHTML = historico.map(item => `
            <div class="dropdown-item">
                <span class="item-text">📹 ${item.nome}</span>
                <span style="color: #666; font-size: 10px;">${item.data}</span>
            </div>
        `).join('');
    }

    function limparHistorico() {
        if (confirm("Apagar o histórico de envios registrados localmente?")) {
            localStorage.removeItem('tb_history');
            document.getElementById('historyList').innerHTML = '<div style="color: #666; text-align: center; padding: 14px;">Nenhum envio registrado.</div>';
        }
    }
</script>

</body>
</html>
