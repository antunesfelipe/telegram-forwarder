<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Forwarder Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 520px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #0088cc; font-size: 22px; text-align: center; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-size: 13px; color: #ccc; font-weight: bold; }
        textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 13px; box-sizing: border-box; height: 60px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-send { background: #0088cc; color: white; }
        .btn-send:hover { background: #006699; }
        .btn-cancel { background: #d32f2f; color: white; display: none; }
        .btn-cancel:hover { background: #9a0007; }
        #status-box { margin-top: 20px; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; background: #2a2a2a; display: none; }
        .in_progress { color: #ffb74d; border: 1px solid #ffb74d; }
        .success { color: #81c784; border: 1px solid #81c784; }
        .failure { color: #e57373; border: 1px solid #e57373; }
        .history-section { margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .history-title { font-size: 14px; color: #0088cc; font-weight: bold; }
        .btn-clear { background: transparent; border: none; color: #888; font-size: 11px; cursor: pointer; }
        .btn-clear:hover { color: #e57373; }
        .history-list { max-height: 160px; overflow-y: auto; font-size: 12px; background: #181818; border-radius: 6px; padding: 8px; border: 1px solid #2a2a2a; }
        .history-item { padding: 6px 4px; border-bottom: 1px solid #252525; display: flex; flex-direction: column; gap: 2px; }
        .history-item:last-child { border-bottom: none; }
        .item-title { color: #eee; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-date { color: #777; font-size: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Telegram Forwarder</h2>

    <label for="legenda1">Vídeo 1 - Legenda Exata:</label>
    <textarea id="legenda1" placeholder="Cole a legenda do primeiro vídeo..."></textarea>

    <label for="legenda2">Vídeo 2 (Opcional):</label>
    <textarea id="legenda2" placeholder="Cole a legenda do segundo vídeo (opcional)..."></textarea>

    <div class="btn-group">
        <button class="btn-send" id="btnSend" onclick="dispararActions()">Enviar Vídeo(s)</button>
        <button class="btn-cancel" id="btnCancel" onclick="cancelarRun()">Parar Execução</button>
    </div>

    <div id="status-box"></div>

    <div class="history-section">
        <div class="history-header">
            <span class="history-title">📋 Histórico de Envios</span>
            <button class="btn-clear" onclick="limparHistorico()">Limpar</button>
        </div>
        <div class="history-list" id="historyList">
            <div style="color: #666; text-align: center; padding: 10px;">Nenhum envio gravado.</div>
        </div>
    </div>
</div>

<script>
    const GITHUB_TOKEN = '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'; 
    const REPO_OWNER = 'antunesfelipe';           
    const REPO_NAME = 'telegram-forwarder';
    const WORKFLOW_ID = 'transferir.yml';

    let currentRunId = null;
    let pollInterval = null;
    let legendasEnviadasTemp = [];

    window.onload = carregarHistorico;

    async function dispararActions() {
        const leg1 = document.getElementById('legenda1').value.trim();
        const leg2 = document.getElementById('legenda2').value.trim();

        if (!leg1 && !leg2) return atualizarStatus('Digite ao menos uma legenda!', 'failure');

        const legendaFinal = leg2 ? `${leg1} ||| ${leg2}` : leg1;
        legendasEnviadasTemp = [leg1, leg2].filter(Boolean);

        atualizarStatus('⏳ Conectando ao GitHub Actions...', 'in_progress');
        document.getElementById('btnSend').disabled = true;

        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`;

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ref: 'main', inputs: { legenda_busca: legendaFinal } })
            });

            if (res.status === 204) {
                setTimeout(monitorarStatus, 4000);
            } else {
                const err = await res.json();
                atualizarStatus(`Erro (${res.status}): ${err.message}`, 'failure');
                document.getElementById('btnSend').disabled = false;
            }
        } catch (e) {
            atualizarStatus('Erro de conexão ao disparar.', 'failure');
            document.getElementById('btnSend').disabled = false;
        }
    }

    async function monitorarStatus() {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs?workflow_id=${WORKFLOW_ID}&per_page=1`;

        try {
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
            });
            const data = await res.json();
            
            if (data.workflow_runs && data.workflow_runs.length > 0) {
                const latestRun = data.workflow_runs[0];
                currentRunId = latestRun.id;

                if (latestRun.status === 'in_progress' || latestRun.status === 'queued') {
                    atualizarStatus(`⏳ Processando vídeo(s)... (Status: ${latestRun.status})`, 'in_progress');
                    document.getElementById('btnCancel').style.display = 'block';
                    pollInterval = setTimeout(monitorarStatus, 3000);
                } else if (latestRun.status === 'completed') {
                    document.getElementById('btnCancel').style.display = 'none';
                    document.getElementById('btnSend').disabled = false;
                    
                    if (latestRun.conclusion === 'success') {
                        atualizarStatus('✅ Vídeo(s) enviado(s) com sucesso!', 'success');
                        salvarNoHistorico(legendasEnviadasTemp);
                        document.getElementById('legenda1').value = '';
                        document.getElementById('legenda2').value = '';
                    } else {
                        atualizarStatus(`❌ Falha no script (Status: ${latestRun.conclusion}).`, 'failure');
                    }
                }
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function cancelarRun() {
        if (!currentRunId) return;

        atualizarStatus('⏳ Cancelando execução...', 'in_progress');
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs/${currentRunId}/cancel`;

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
            });

            if (res.status === 202) {
                clearTimeout(pollInterval);
                atualizarStatus('🛑 Execução cancelada.', 'failure');
                document.getElementById('btnCancel').style.display = 'none';
                document.getElementById('btnSend').disabled = false;
            }
        } catch (e) {
            alert('Não foi possível cancelar.');
        }
    }

    function atualizarStatus(msg, tipo) {
        const div = document.getElementById('status-box');
        div.style.display = 'block';
        div.className = tipo;
        div.innerText = msg;
    }

    function salvarNoHistorico(legendas) {
        let historico = JSON.parse(localStorage.getItem('tb_history') || '[]');
        const agora = new Date().toLocaleString('pt-BR');

        legendas.forEach(leg => {
            historico.unshift({ nome: leg, data: agora });
        });

        historico = historico.slice(0, 30);
        localStorage.setItem('tb_history', JSON.stringify(historico));
        carregarHistorico();
    }

    function carregarHistorico() {
        const historico = JSON.parse(localStorage.getItem('tb_history') || '[]');
        const listContainer = document.getElementById('historyList');

        if (historico.length === 0) {
            listContainer.innerHTML = '<div style="color: #666; text-align: center; padding: 10px;">Nenhum envio gravado.</div>';
            return;
        }

        listContainer.innerHTML = historico.map(item => `
            <div class="history-item">
                <span class="item-title">📹 ${item.nome}</span>
                <span class="item-date">📅 ${item.data}</span>
            </div>
        `).join('');
    }

    function limparHistorico() {
        if (confirm("Deseja apagar o histórico de envios?")) {
            localStorage.removeItem('tb_history');
            carregarHistorico();
        }
    }
</script>

</body>
</html>
